<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelCraft 像素工坊</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>PixelCraft 像素工坊</h1>
            <p>真像素画缩放器 + 自动绘画助手</p>
        </header>

        <!-- 标签切换 -->
        <nav class="tabs">
            <button class="tab active" data-tab="scaler">像素画缩放器</button>
            <button class="tab" data-tab="painter">自动绘画助手</button>
        </nav>

        <main>
            <!-- ==================== 标签1：像素画缩放器 ==================== -->
            <section class="tab-content active" id="tab-scaler">
                <!-- 上传区域 -->
                <div class="upload-section" id="uploadSection">
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-icon">📁</div>
                        <p>拖拽图片到此处 或 点击上传</p>
                        <p class="hint">支持 PNG / JPG / WebP</p>
                        <input type="file" id="fileInput" accept="image/*" hidden>
                    </div>
                </div>

                <!-- 工作区 -->
                <div class="workspace" id="workspace" style="display:none;">
                    <div class="preview-container">
                        <div class="preview-panel">
                            <div class="panel-label">原图</div>
                            <div class="panel-info" id="originalInfo"></div>
                            <div class="canvas-container">
                                <canvas id="originalCanvas"></canvas>
                            </div>
                        </div>
                        <div class="arrow-divider">
                            <svg width="40" height="40" viewBox="0 0 40 40">
                                <line x1="5" y1="20" x2="30" y2="20" stroke="#4CAF50" stroke-width="2"/>
                                <polyline points="22,12 32,20 22,28" fill="none" stroke="#4CAF50" stroke-width="2"/>
                            </svg>
                        </div>
                        <div class="preview-panel">
                            <div class="panel-label">像素画</div>
                            <div class="panel-info" id="resultInfo"></div>
                            <div class="canvas-container">
                                <canvas id="resultCanvas"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="control-panel">
                        <div class="control-row">
                            <div class="input-group">
                                <label>目标宽度</label>
                                <input type="number" id="targetWidth" value="64" min="1" max="2048" class="size-input">
                                <span>px</span>
                            </div>
                            <div class="input-group">
                                <label>目标高度</label>
                                <input type="number" id="targetHeight" value="64" min="1" max="2048" class="size-input">
                                <span>px</span>
                            </div>
                            <button id="processBtn" class="btn btn-primary">生成像素画</button>
                        </div>
                        <div class="control-row">
                            <div class="input-group">
                                <label>导出大小</label>
                                <select id="exportScale" class="select-input">
                                    <option value="1">1x (原始像素)</option>
                                    <option value="2">2x</option>
                                    <option value="4">4x</option>
                                    <option value="8">8x</option>
                                </select>
                            </div>
                            <button id="downloadBtn" class="btn btn-download" disabled>💾 下载图片</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- ==================== 标签2：自动绘画助手 ==================== -->
            <section class="tab-content" id="tab-painter">
                <div class="painter-layout">
                    <!-- 左侧：图片预览 -->
                    <div class="painter-preview">
                        <div class="section-title">像素画预览</div>
                        <div class="canvas-container" id="painterCanvasContainer">
                            <canvas id="painterCanvas"></canvas>
                        </div>
                        <div class="painter-info" id="painterInfo"></div>
                        <!-- 如果缩放器已有图片，可以复用 -->
                        <button id="useScalerImageBtn" class="btn btn-secondary" style="display:none;">
                            📋 使用缩放器中的图片
                        </button>
                        <!-- 独立上传 -->
                        <div class="painter-upload">
                            <input type="file" id="painterFileInput" accept="image/*" hidden>
                            <button id="painterUploadBtn" class="btn btn-secondary">📁 上传新图片</button>
                        </div>
                        <div class="input-group" style="margin-top:12px;">
                            <label>目标宽度</label>
                            <input type="number" id="painterTargetWidth" value="64" min="1" max="2048" class="size-input">
                            <span>px</span>
                        </div>
                        <div class="input-group">
                            <label>目标高度</label>
                            <input type="number" id="painterTargetHeight" value="64" min="1" max="2048" class="size-input">
                            <span>px</span>
                        </div>
                        <button id="analyzeBtn" class="btn btn-primary" disabled>🔍 分析颜色</button>
                    </div>

                    <!-- 右侧：颜色分析结果 -->
                    <div class="painter-results">
                        <div class="section-title">颜色分析结果</div>
                        <div class="painter-stats" id="painterStats"></div>
                        <div class="input-group" style="margin:12px 0;">
                            <label>颜色容差</label>
                            <input type="range" id="colorTolerance" min="0" max="100" value="0" class="slider">
                            <span id="toleranceValue">0</span>
                        </div>
                        <!-- ★ 新增：方舟像素复选框 -->
                        <div class="input-group" style="margin:8px 0;">
                            <label class="checkbox-wrapper">
                                <input type="checkbox" id="arkPixelCheckbox">
                                <span class="checkbox-text">🎮 方舟像素</span>
                            </label>
                            <span style="font-size:0.75em;color:#888;margin-left:4px;">限定为明日方舟风格 40 色</span>
                        </div>
                        <div class="color-list" id="colorList">
                            <!-- 动态生成颜色列表 -->
                        </div>
                        <!-- 下载文件 -->
                        <div class="download-section">
                            <div class="section-title" style="margin-top:16px;">📥 下载文件</div>
                            <p style="font-size:0.8em;color:#888;margin:8px 0;">
                                首次使用请下载 EXE 程序，后续只需下载 JSON 指令文件
                            </p>
                            <div class="download-buttons">
                                <button id="downloadExeBtn" class="btn btn-download" style="background:#FF9800;">📥 下载 EXE 程序</button>
                                <button id="downloadJsonBtn" class="btn btn-download" disabled>📥 下载 JSON 指令</button>
                            </div>
                            <p style="font-size:0.75em;color:#666;margin-top:8px;">
                                EXE 程序只需下载一次 |
                                备用：
                                <a href="#" id="downloadPyLink" style="color:#888;">下载 PY 脚本</a>
                            </p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/scaler.js"></script>
    <script src="js/painter.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
